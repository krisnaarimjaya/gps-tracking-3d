<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GPS Marking & Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIINfQ3b0l0R0J4eQ9k5w1Y5w6G8J4n6Y3Y="
 crossorigin=""/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">

<style>
:root{
  --panel:#ffffff;
  --text:#17202a;
  --muted:#64748b;
  --line:#dbe2ea;
  --accent:#2563eb;
  --danger:#dc2626;
  --ok:#16a34a;
  --shadow:0 4px 18px rgba(0,0,0,.16);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
body{overflow:hidden;background:#e5e7eb}
#map2d,#map3d{position:absolute;inset:0}
#map3d{display:none}

.topbar{
  position:absolute;z-index:1000;top:10px;left:10px;right:10px;
  display:flex;align-items:center;gap:8px;pointer-events:none;
}
.title{
  background:rgba(255,255,255,.95);padding:9px 12px;border-radius:12px;
  box-shadow:var(--shadow);font-weight:700;font-size:15px;pointer-events:auto;
}
.status{
  background:rgba(255,255,255,.95);padding:8px 10px;border-radius:12px;
  box-shadow:var(--shadow);font-size:12px;color:var(--muted);pointer-events:auto;
}
.spacer{flex:1}
.controls{
  position:absolute;z-index:1000;right:10px;top:68px;
  display:flex;flex-direction:column;gap:7px;
}
button{
  border:0;background:var(--panel);color:var(--text);border-radius:11px;
  min-width:44px;min-height:44px;padding:8px 10px;box-shadow:var(--shadow);
  cursor:pointer;font:inherit;font-size:13px;
}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:white}
button.danger{background:var(--danger);color:white}
button.ok{background:var(--ok);color:white}
button.small{min-height:38px;padding:6px 9px}
.icon{width:20px;height:20px;display:block;margin:auto}
.btnText{display:block;margin-top:2px}

.bottom{
  position:absolute;z-index:1000;left:10px;right:10px;bottom:10px;
  display:flex;gap:8px;align-items:end;
}
.panel{
  background:rgba(255,255,255,.96);border-radius:14px;box-shadow:var(--shadow);
  padding:10px;backdrop-filter:blur(8px);
}
.info{min-width:250px;max-width:calc(100vw - 20px)}
.infoRow{display:flex;justify-content:space-between;gap:16px;font-size:12px;padding:2px 0}
.infoRow span:first-child{color:var(--muted)}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.hidden{display:none!important}

.dialog{
  position:absolute;z-index:2000;inset:0;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.dialogCard{
  width:min(520px,100%);max-height:85vh;overflow:auto;background:white;border-radius:16px;
  box-shadow:0 15px 50px rgba(0,0,0,.28);padding:16px;
}
.dialogHeader{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dialogHeader h3{margin:0}
.list{margin-top:10px;border-top:1px solid var(--line)}
.item{
  display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
  font-size:13px;
}
.item b{display:block}
.item small{color:var(--muted)}
.badge{padding:3px 7px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:11px}
input[type=file]{display:none}
.notice{
  position:absolute;z-index:1500;left:50%;top:68px;transform:translateX(-50%);
  background:#111827;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.notice.show{opacity:1}
.leaflet-control-attribution{font-size:9px}
.gps-dot{
  width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid white;
  box-shadow:0 0 0 7px rgba(37,99,235,.18),0 2px 6px rgba(0,0,0,.25);
}
.gps-arrow{
  width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
  border-bottom:18px solid #2563eb;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
}
</style>
</head>

<body>
<div id="map2d"></div>
<div id="map3d"></div>

<div class="topbar">
  <div class="title">GPS Marking & Tracking</div>
  <div class="status" id="status">GPS belum aktif</div>
  <div class="spacer"></div>
</div>

<div class="controls">
  <button id="btnGps" class="primary" title="Aktifkan GPS" aria-label="Aktifkan GPS">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
    </svg>
  </button>
  <button id="btnFollow" title="Ikuti posisi GPS" aria-label="Ikuti posisi GPS">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2l4 9-4 11-4-11 4-9z"/><circle cx="12" cy="12" r="2"/>
    </svg>
  </button>
  <button id="btnMode" title="2D / 3D" aria-label="2D atau 3D">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9z"/>
    </svg>
  </button>
  <button id="btnMark" class="ok" title="Tandai posisi sekarang" aria-label="Tandai posisi sekarang">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 21s7-6.1 7-12a7 7 0 10-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="9" r="2.2"/>
    </svg>
  </button>
  <button id="btnTrack" title="Mulai / hentikan tracking" aria-label="Mulai atau hentikan tracking">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="6" cy="18" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="6" r="2"/>
      <path d="M7.5 16.5l3-3M13.5 10.5l3-3"/>
    </svg>
  </button>
  <button id="btnData" title="Data tersimpan" aria-label="Data tersimpan">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 4h16v16H4z"/><path d="M8 4v5h8V4M8 15h8M8 18h5"/>
    </svg>
  </button>
  <button id="btnExport" title="Ekspor GeoJSON" aria-label="Ekspor GeoJSON">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/>
    </svg>
  </button>
  <button id="btnImport" title="Impor GeoJSON" aria-label="Impor GeoJSON">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 20h14"/>
    </svg>
  </button>
  <input id="fileInput" type="file" accept=".geojson,.json,application/geo+json,application/json">
  <button id="btnClear" class="danger" title="Hapus semua data" aria-label="Hapus semua data">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
    </svg>
  </button>
</div>

<div class="bottom">
  <div class="panel info">
    <div class="infoRow"><span>Latitude</span><b id="lat">-</b></div>
    <div class="infoRow"><span>Longitude</span><b id="lon">-</b></div>
    <div class="infoRow"><span>Akurasi</span><b id="acc">-</b></div>
    <div class="infoRow"><span>Tracking</span><b id="trackInfo">Tidak aktif</b></div>
  </div>
</div>

<div id="notice" class="notice"></div>

<div id="dataDialog" class="dialog hidden">
  <div class="dialogCard">
    <div class="dialogHeader">
      <h3>Data tersimpan</h3>
      <button id="closeDialog" class="small" aria-label="Tutup">✕</button>
    </div>
    <div id="dataList" class="list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Q3KcJq8fM9r5Q5r6n2rQ="
 crossorigin=""></script>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "gps_marking_tracking_v1";
  const state = {
    gps: null,
    watchId: null,
    tracking: false,
    track: [],
    marks: [],
    mode3d: false,
    follow: true,
    trackLayer: null,
    gpsMarker: null,
    accuracyCircle: null,
    marksLayer: null,
    map3dMarker: null
  };

  const $ = id => document.getElementById(id);
  const statusEl = $("status");

  function notify(msg){
    const el = $("notice");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(notify.t);
    notify.t = setTimeout(() => el.classList.remove("show"), 2300);
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const obj = JSON.parse(raw);
      state.marks = Array.isArray(obj.marks) ? obj.marks : [];
      state.track = Array.isArray(obj.track) ? obj.track : [];
    }catch(e){
      console.warn(e);
    }
  }

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: 1,
      marks: state.marks,
      track: state.track
    }));
  }

  const map2d = L.map("map2d", {
    zoomControl: false,
    preferCanvas: true
  }).setView([-2.5, 118], 5);

  L.control.zoom({position:"bottomright"}).addTo(map2d);

  // OSM digunakan sebagai base map demo. Untuk produksi, gunakan tile provider
  // yang mengizinkan penggunaan sesuai kapasitas/aplikasi Anda.
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map2d);

  state.trackLayer = L.polyline([], {
    color: "#2563eb",
    weight: 4,
    opacity: .85
  }).addTo(map2d);

  state.marksLayer = L.layerGroup().addTo(map2d);

  const gpsIcon = L.divIcon({
    className:"",
    html:'<div class="gps-dot"></div>',
    iconSize:[18,18],
    iconAnchor:[9,9]
  });

  function updateGpsOn2D(){
    if(!state.gps) return;
    const {lat, lon, accuracy} = state.gps;

    if(!state.gpsMarker){
      state.gpsMarker = L.marker([lat,lon], {icon:gpsIcon, zIndexOffset:1000}).addTo(map2d);
    }else{
      state.gpsMarker.setLatLng([lat,lon]);
    }

    if(!state.accuracyCircle){
      state.accuracyCircle = L.circle([lat,lon], {
        radius: accuracy || 0,
        color:"#2563eb",
        weight:1,
        fillOpacity:.08
      }).addTo(map2d);
    }else{
      state.accuracyCircle.setLatLng([lat,lon]);
      state.accuracyCircle.setRadius(accuracy || 0);
    }

    if(state.follow){
      map2d.panTo([lat,lon], {animate:true, duration:.25});
    }
  }

  function redrawTrack(){
    state.trackLayer.setLatLngs(state.track.map(p => [p.lat,p.lon]));
  }

  function redrawMarks(){
    state.marksLayer.clearLayers();
    state.marks.forEach((m, i) => {
      const marker = L.marker([m.lat,m.lon]).addTo(state.marksLayer);
      marker.bindPopup(
        `<b>${escapeHtml(m.name || "Mark " + (i+1))}</b><br>` +
        `Lat: ${m.lat.toFixed(7)}<br>` +
        `Lon: ${m.lon.toFixed(7)}<br>` +
        `Akurasi: ${Number(m.accuracy || 0).toFixed(1)} m<br>` +
        `<small>${new Date(m.timestamp).toLocaleString("id-ID")}</small>`
      );
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  // ---------- 3D MapLibre ----------
  const map3d = new maplibregl.Map({
    container: "map3d",
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: [
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
          ],
          tileSize: 256,
          attribution: "© OpenStreetMap contributors"
        }
      },
      layers: [
        { id:"osm", type:"raster", source:"osm" }
      ]
    },
    center: [118, -2.5],
    zoom: 4
  });

  map3d.addControl(new maplibregl.NavigationControl(), "bottom-right");

  map3d.on("load", () => {
    map3d.setProjection({type:"globe"});
    add3DDataSources();
  });

  function add3DDataSources(){
    if(!map3d.getSource("track")) {
      map3d.addSource("track", {
        type:"geojson",
        data: featureCollectionTrack()
      });
      map3d.addLayer({
        id:"track-line",
        type:"line",
        source:"track",
        paint:{
          "line-color":"#2563eb",
          "line-width":4
        }
      });
    }
    if(!map3d.getSource("marks")) {
      map3d.addSource("marks", {
        type:"geojson",
        data: featureCollectionMarks()
      });
      map3d.addLayer({
        id:"marks-circle",
        type:"circle",
        source:"marks",
        paint:{
          "circle-radius":6,
          "circle-color":"#16a34a",
          "circle-stroke-color":"#ffffff",
          "circle-stroke-width":2
        }
      });
    }
  }

  function featureCollectionTrack(){
    return {
      type:"FeatureCollection",
      features: state.track.length >= 2 ? [{
        type:"Feature",
        properties:{type:"track"},
        geometry:{
          type:"LineString",
          coordinates: state.track.map(p => [p.lon,p.lat])
        }
      }] : []
    };
  }

  function featureCollectionMarks(){
    return {
      type:"FeatureCollection",
      features: state.marks.map(m => ({
        type:"Feature",
        properties:{
          name:m.name,
          accuracy:m.accuracy,
          timestamp:m.timestamp
        },
        geometry:{type:"Point",coordinates:[m.lon,m.lat]}
      }))
    };
  }

  function update3DData(){
    if(!map3d.loaded()) return;
    const t = map3d.getSource("track");
    const m = map3d.getSource("marks");
    if(t) t.setData(featureCollectionTrack());
    if(m) m.setData(featureCollectionMarks());

    if(state.gps){
      const [lon,lat] = [state.gps.lon,state.gps.lat];
      if(!state.map3dMarker){
        const el = document.createElement("div");
        el.className = "gps-dot";
        state.map3dMarker = new maplibregl.Marker({element:el})
          .setLngLat([lon,lat]).addTo(map3d);
      }else{
        state.map3dMarker.setLngLat([lon,lat]);
      }
      if(state.follow) map3d.easeTo({center:[lon,lat], duration:350});
    }
  }

  function setMode3D(on){
    state.mode3d = on;
    $("map2d").style.display = on ? "none" : "block";
    $("map3d").style.display = on ? "block" : "none";
    $("btnMode").title = on ? "Kembali ke 2D" : "Beralih ke 3D";

    if(on){
      const c = state.gps ? [state.gps.lon,state.gps.lat] : map2d.getCenter().toArray().reverse();
      map3d.resize();
      map3d.jumpTo({center:c, zoom:Math.max(2,map2d.getZoom()-1)});
      update3DData();
      notify("Mode 3D aktif");
    }else{
      map2d.invalidateSize();
      if(state.gps) map2d.setView([state.gps.lat,state.gps.lon], Math.max(map2d.getZoom(),16));
      notify("Mode 2D aktif");
    }
  }

  function startGPS(){
    if(!navigator.geolocation){
      notify("Perangkat/browser tidak mendukung GPS");
      statusEl.textContent = "GPS tidak tersedia";
      return;
    }
    if(state.watchId !== null) return;

    statusEl.textContent = "Mengaktifkan GPS…";
    state.watchId = navigator.geolocation.watchPosition(onPosition, onGpsError, {
      enableHighAccuracy:true,
      maximumAge:1000,
      timeout:15000
    });
  }

  function onPosition(pos){
    const c = pos.coords;
    state.gps = {
      lat:c.latitude,
      lon:c.longitude,
      accuracy:Number.isFinite(c.accuracy) ? c.accuracy : null,
      altitude:Number.isFinite(c.altitude) ? c.altitude : null,
      heading:Number.isFinite(c.heading) ? c.heading : null,
      speed:Number.isFinite(c.speed) ? c.speed : null,
      timestamp:new Date(pos.timestamp || Date.now()).toISOString()
    };

    $("lat").textContent = state.gps.lat.toFixed(7);
    $("lon").textContent = state.gps.lon.toFixed(7);
    $("acc").textContent = state.gps.accuracy == null ? "-" : state.gps.accuracy.toFixed(1) + " m";
    statusEl.textContent = "GPS aktif";

    updateGpsOn2D();
    update3DData();

    if(state.tracking){
      const last = state.track[state.track.length-1];
      const minDistance = 2; // meter, mencegah terlalu banyak titik identik
      if(!last || haversine(last.lat,last.lon,state.gps.lat,state.gps.lon) >= minDistance){
        state.track.push({...state.gps});
        redrawTrack();
        update3DData();
        saveData();
      }
      $("trackInfo").textContent = `${state.track.length} titik`;
    }
  }

  function onGpsError(err){
    const messages = {
      1:"Izin lokasi ditolak",
      2:"Posisi tidak tersedia",
      3:"GPS timeout"
    };
    statusEl.textContent = messages[err.code] || "GPS error";
    notify(messages[err.code] || "GPS error");
  }

  function haversine(lat1,lon1,lat2,lon2){
    const R=6371008.8, rad=Math.PI/180;
    const dLat=(lat2-lat1)*rad, dLon=(lon2-lon1)*rad;
    const a=Math.sin(dLat/2)**2+
      Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }

  function markPosition(){
    if(!state.gps){
      notify("Aktifkan GPS dan tunggu posisi diperoleh");
      startGPS();
      return;
    }
    const name = prompt("Nama marking:", `Mark ${state.marks.length+1}`);
    if(name === null) return;

    const m = {
      id:crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      name:name.trim() || `Mark ${state.marks.length+1}`,
      lat:state.gps.lat,
      lon:state.gps.lon,
      accuracy:state.gps.accuracy,
      altitude:state.gps.altitude,
      timestamp:state.gps.timestamp
    };
    state.marks.push(m);
    saveData();
    redrawMarks();
    update3DData();
    notify("Marking tersimpan");
  }

  function toggleTracking(){
    if(!state.tracking){
      startGPS();
      state.tracking=true;
      $("btnTrack").classList.add("danger");
      $("trackInfo").textContent=`${state.track.length} titik`;
      notify("Tracking dimulai");
    }else{
      state.tracking=false;
      $("btnTrack").classList.remove("danger");
      $("trackInfo").textContent=`${state.track.length} titik`;
      saveData();
      notify("Tracking dihentikan");
    }
  }

  function makeGeoJSON(){
    return {
      type:"FeatureCollection",
      name:"GPS Marking & Tracking",
      features:[
        ...state.marks.map(m => ({
          type:"Feature",
          properties:{
            id:m.id,
            name:m.name,
            type:"marking",
            accuracy_m:m.accuracy,
            altitude_m:m.altitude,
            timestamp:m.timestamp
          },
          geometry:{type:"Point",coordinates:[m.lon,m.lat]}
        })),
        ...(state.track.length >= 2 ? [{
          type:"Feature",
          properties:{
            type:"tracking",
            point_count:state.track.length,
            started_at:state.track[0]?.timestamp || null,
            ended_at:state.track[state.track.length-1]?.timestamp || null
          },
          geometry:{
            type:"LineString",
            coordinates:state.track.map(p=>[p.lon,p.lat])
          }
        }] : [])
      ]
    };
  }

  function exportGeoJSON(){
    const geojson=makeGeoJSON();
    const blob=new Blob([JSON.stringify(geojson,null,2)],{type:"application/geo+json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`gps_${new Date().toISOString().replace(/[:.]/g,"-")}.geojson`;
    a.click();
    URL.revokeObjectURL(url);
    notify("GeoJSON diekspor");
  }

  function importGeoJSON(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const gj=JSON.parse(reader.result);
        const features=gj.type==="FeatureCollection" ? gj.features :
          gj.type==="Feature" ? [gj] : [];

        let marksAdded=0, tracksAdded=0;

        for(const f of features){
          if(!f || !f.geometry) continue;
          const type=f.geometry.type;
          const props=f.properties || {};

          if(type==="Point"){
            const [lon,lat]=f.geometry.coordinates;
            if(Number.isFinite(lat)&&Number.isFinite(lon)){
              state.marks.push({
                id:props.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+marksAdded)),
                name:props.name || `Import ${state.marks.length+1}`,
                lat,lon,
                accuracy:props.accuracy_m ?? null,
                altitude:props.altitude_m ?? null,
                timestamp:props.timestamp || new Date().toISOString()
              });
              marksAdded++;
            }
          }else if(type==="LineString"){
            for(const c of f.geometry.coordinates){
              if(Array.isArray(c)&&c.length>=2){
                state.track.push({
                  lat:Number(c[1]),lon:Number(c[0]),
                  accuracy:null,altitude:null,
                  timestamp:new Date().toISOString()
                });
              }
            }
            tracksAdded++;
          }
        }
        saveData(); redrawMarks(); redrawTrack(); update3DData();
        notify(`Impor selesai: ${marksAdded} marking, ${tracksAdded} track`);
      }catch(e){
        console.error(e);
        notify("File GeoJSON tidak valid");
      }
    };
    reader.readAsText(file);
  }

  function showData(){
    const list=$("dataList");
    list.innerHTML="";
    const summary=document.createElement("div");
    summary.className="item";
    summary.innerHTML=`<div><b>Ringkasan</b><small>${state.marks.length} marking · ${state.track.length} titik tracking</small></div><span class="badge">GeoJSON</span>`;
    list.appendChild(summary);

    state.marks.forEach((m,i)=>{
      const row=document.createElement("div");
      row.className="item";
      row.innerHTML=`<div><b>${escapeHtml(m.name)}</b><small>${m.lat.toFixed(7)}, ${m.lon.toFixed(7)}</small></div><span class="badge">Mark</span>`;
      row.onclick=()=>{ map2d.setView([m.lat,m.lon],18); setMode3D(false); };
      list.appendChild(row);
    });
    $("dataDialog").classList.remove("hidden");
  }

  function clearAll(){
    if(!confirm("Hapus semua marking dan tracking dari perangkat?")) return;
    state.marks=[]; state.track=[];
    saveData(); redrawMarks(); redrawTrack(); update3DData();
    $("trackInfo").textContent="Tidak aktif";
    notify("Semua data dihapus");
  }

  $("btnGps").onclick=startGPS;
  $("btnFollow").onclick=()=>{
    state.follow=!state.follow;
    $("btnFollow").classList.toggle("primary",state.follow);
    if(state.follow && state.gps){
      if(state.mode3d) map3d.easeTo({center:[state.gps.lon,state.gps.lat]});
      else map2d.panTo([state.gps.lat,state.gps.lon]);
    }
  };
  $("btnMode").onclick=()=>setMode3D(!state.mode3d);
  $("btnMark").onclick=markPosition;
  $("btnTrack").onclick=toggleTracking;
  $("btnData").onclick=showData;
  $("btnExport").onclick=exportGeoJSON;
  $("btnImport").onclick=()=>$("fileInput").click();
  $("fileInput").onchange=e=>{
    if(e.target.files[0]) importGeoJSON(e.target.files[0]);
    e.target.value="";
  };
  $("btnClear").onclick=clearAll;
  $("closeDialog").onclick=()=>$("dataDialog").classList.add("hidden");
  $("dataDialog").onclick=e=>{if(e.target===$("dataDialog")) $("dataDialog").classList.add("hidden")};

  loadData();
  redrawMarks();
  redrawTrack();
  $("trackInfo").textContent=`${state.track.length} titik`;
  map2d.on("dragstart",()=>state.follow=false);

  // Minta izin GPS hanya setelah user menekan tombol, agar lebih sesuai kebijakan browser.
})();
</script>
</body>
</html>
